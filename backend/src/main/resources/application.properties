spring.application.name=pda-backend

# Profile
spring.profiles.active=${APP_ENV:dev}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Swagger
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.csrf.enabled=${API_DOCS_ENABLED:false}

# Server
server.port=${BACKEND_PORT:8080}

# Uploads: the 512 KB project logo and 10 MB task attachments use multipart. The servlet limit is the loosest of
# them (10 MB file + form overhead); each service enforces its own exact limit.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=11MB

# Task deadline reminders (ISO-8601 duration): how often open tasks are scanned for due-soon / overdue deadlines.
pda.task.deadline-scan-interval=${TASK_DEADLINE_SCAN_INTERVAL:PT5M}

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO

# Private organization images: Docker mounts a persistent volume at this same path.
pda.organization.media.storage-path=${ORGANIZATION_MEDIA_STORAGE_PATH:.local/organization-media}
