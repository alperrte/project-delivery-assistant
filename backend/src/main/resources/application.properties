spring.application.name=pda-backend

# Profile
spring.profiles.active=${APP_ENV:dev}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Swagger
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.csrf.enabled=${API_DOCS_ENABLED:false}

# Server
server.port=${BACKEND_PORT:8080}

# Uploads: only the 512 KB project logo uses multipart; the service enforces the exact limit.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
