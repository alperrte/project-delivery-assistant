spring.application.name=pda-backend

# Profile
spring.profiles.active=${APP_ENV:dev}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Swagger
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Server
server.port=${BACKEND_PORT:8080}

# Logging
logging.level.root=${LOG_LEVEL:INFO}