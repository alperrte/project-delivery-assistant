spring.application.name=pda-backend

# Profile
spring.profiles.active=${APP_ENV:dev}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Swagger
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.csrf.enabled=${API_DOCS_ENABLED:false}

# Server
server.port=${BACKEND_PORT:8080}

# Response compression for the JSON API (gzip). Bodies under the minimum size are not worth the CPU. Nothing else is
# compressed: the frontend (Next.js) compresses its own pages and assets.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Error responses never carry internals: no stack trace, no exception message, no binding details. The API's own
# ProblemDetail handlers produce the user-facing error bodies; this only closes the framework's default /error page.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Actuator: only the health endpoint is exposed over HTTP; no env, beans, heapdump or other operational endpoints.
management.endpoints.web.exposure.include=health

# Uploads: the 512 KB project logo and 10 MB task attachments use multipart. The servlet limit is the loosest of
# them (10 MB file + form overhead); each service enforces its own exact limit.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=11MB

# Task deadline reminders (ISO-8601 duration): how often open tasks are scanned for due-soon / overdue deadlines.
pda.task.deadline-scan-interval=${TASK_DEADLINE_SCAN_INTERVAL:PT5M}

# GitHub repository integration (read-only, public repositories only). The optional server token only raises
# GitHub's rate limit (60 -> 5000 requests/hour); it is never logged or returned. Empty = unauthenticated.
pda.github.api-token=${GITHUB_API_TOKEN:}
# How often connected repositories are scanned for new default-branch commits (ISO-8601 duration).
pda.github.commit-scan-interval=${GITHUB_COMMIT_SCAN_INTERVAL:PT5M}
# Repositories scanned per round; 0 = automatic (5 without a token, 50 with one).
pda.github.commit-scan-batch=${GITHUB_COMMIT_SCAN_BATCH:0}
# Short in-memory cache for GitHub reads (PT0S disables it).
pda.github.cache-ttl=${GITHUB_CACHE_TTL:PT60S}
# Repository reads allowed per user per minute.
pda.github.read-limit-per-minute=${GITHUB_READ_LIMIT_PER_MINUTE:60}

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO

# Private organization images: Docker mounts a persistent volume at this same path.
pda.organization.media.storage-path=${ORGANIZATION_MEDIA_STORAGE_PATH:.local/organization-media}

# Public contact form: the one fixed recipient of every message. It is server configuration only; the browser can never
# choose or influence it. Mail itself uses the MAIL_*/SMTP_* settings shared with the other mails.
pda.contact.recipient=${CONTACT_RECIPIENT:pdassistant.info@gmail.com}
# Bot traps of the contact form (no CAPTCHA): a form submitted sooner than the minimum fill time after it was shown is a
# bot; a form timestamp older than the maximum age (or from the future) is reported as invalid instead. While the live
# frontend does not send the timestamp yet, leave require-started-at false; once it does, set true so omitting it is a bot.
pda.contact.min-fill-time=${CONTACT_MIN_FILL_TIME:PT3S}
pda.contact.max-form-age=${CONTACT_MAX_FORM_AGE:PT24H}
pda.contact.require-started-at=${CONTACT_REQUIRE_STARTED_AT:false}

# Data retention: one scheduled purge per data family, daily. The cron is in UTC; "-" switches the purges off. Defaults are
# the published retention periods (analytics 12 months, ended sessions 30 days, contact records and support messages
# 12 months, audit events 24 months). Deletes run in batches of the given size and only ever remove expired rows.
pda.retention.cron=${RETENTION_CRON:0 30 3 * * *}
pda.retention.batch-size=${RETENTION_BATCH_SIZE:1000}
pda.retention.analytics-months=${RETENTION_ANALYTICS_MONTHS:12}
pda.retention.user-sessions-days=${RETENTION_USER_SESSIONS_DAYS:30}
pda.retention.contact-months=${RETENTION_CONTACT_MONTHS:12}
pda.retention.audit-months=${RETENTION_AUDIT_MONTHS:24}
