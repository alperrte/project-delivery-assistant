# Weekly dependency update pull requests (security updates are raised separately by GitHub as soon as an advisory exists).
# Updates are only proposed here; nothing is merged without review and the CI workflow passing.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
