# Opt-in production media overlay; never combine with the LOCAL meeting overlay.
# Requires Docker Compose >=2.24.4 (!override). Review the release runbook before use.
# docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.meeting.prod.yml config --quiet
# No production action is performed merely by adding this file.
services:
  backend:
    environment:
      MEETING_MEDIA_ENABLED: ${MEETING_MEDIA_ENABLED:-false}
      LIVEKIT_API_URL: https://${MEDIA_ADDRESS:?Set MEDIA_ADDRESS}
      LIVEKIT_WS_URL: wss://${MEDIA_ADDRESS:?Set MEDIA_ADDRESS}
    depends_on:
      livekit:
        condition: service_healthy

  frontend:
    build:
      args:
        NEXT_PUBLIC_LIVEKIT_URL: wss://${MEDIA_ADDRESS:?Set MEDIA_ADDRESS}
    environment:
      NEXT_PUBLIC_LIVEKIT_URL: wss://${MEDIA_ADDRESS:?Set MEDIA_ADDRESS}

  caddy:
    # Official LiveKit Caddy build: adds Layer4 for TURN/TLS + HTTPS on ONE IP:443.
    # The ordinary four-service production stack keeps its original stock Caddy.
    image: livekit/caddyl4:v2.11.3@sha256:9dd090159a6042a907dbff0ce9dda27a21d2a559dc7b03b60a8e6b1b60b8348e
    command: ["run", "--config", "/etc/caddy/meeting.json"]
    environment:
      MEDIA_ADDRESS: ${MEDIA_ADDRESS:?Set MEDIA_ADDRESS}
      TURN_ADDRESS: ${TURN_ADDRESS:?Set TURN_ADDRESS}
    ports: !override
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ./ops/caddy/meeting.json:/etc/caddy/meeting.json:ro

  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    restart: unless-stopped
    # One bounded SFU on the same small VPS. This budget is NOT proven capacity.
    mem_limit: 1536m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set production media key}: ${LIVEKIT_API_SECRET:?Set production media secret}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${LIVEKIT_NODE_IP:?Set the public IPv4 of this VPS}
          use_external_ip: false
        room:
          auto_create: false
          enable_remote_unmute: false
        turn:
          enabled: true
          domain: ${TURN_ADDRESS:?Set TURN_ADDRESS}
          tls_port: 5349
          external_tls: true
          udp_port: 3478
        webhook:
          api_key: "${LIVEKIT_API_KEY:?Set production media key}"
          urls:
            - http://backend:8080/api/v1/meetings/media/webhook
        logging:
          level: warn
    # Signaling 7880 and unencrypted post-TLS TURN 5349 stay INTERNAL.
    # Published ports must equal the candidates advertised by LiveKit.
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
