# Local end-to-end override. Use it ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#
# It adds a throw-away SMTP sink (Mailpit) and points the backend at it, so the browser tests exercise the real mail
# code path (contact form, verification and reset mails) without ever sending a message to a real mailbox. It also
# raises the per-address rate limits, because every Playwright user registers and signs in from the same address.
#
# For a LOCAL machine only. Never use it for a deployment: the defaults in docker-compose.yml are the production values,
# and a real SMTP provider is configured through .env (MAIL_ENABLED, SMTP_*), never here.
#
# Delivered mail can be read at http://localhost:8025 (UI) and http://localhost:8025/api/v1/messages (API).
services:
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      # Web UI and API only on this machine; the backend reaches the SMTP port (1025) over the compose network.
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend:
    environment:
      # The sink accepts any message without authentication or TLS.
      MAIL_ENABLED: "true"
      MAIL_PROVIDER: smtp
      MAIL_FROM: pda-e2e@example.test
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      # Relaxed limits for repeated browser runs from one address (each can still be overridden from the shell).
      # 200 (not 1000): the invitation-preview rate-limit test must still be able to reach the limit within 220 requests.
      AUTH_RATE_LIMIT_SENSITIVE_MAX_REQUESTS: ${AUTH_RATE_LIMIT_SENSITIVE_MAX_REQUESTS:-200}
      AUTH_RATE_LIMIT_LOGIN_MAX_REQUESTS: ${AUTH_RATE_LIMIT_LOGIN_MAX_REQUESTS:-1000}
      AUTH_RATE_LIMIT_REFRESH_MAX_REQUESTS: ${AUTH_RATE_LIMIT_REFRESH_MAX_REQUESTS:-1000}
      CHAT_SEND_MAX_MESSAGES: ${CHAT_SEND_MAX_MESSAGES:-1000}
      ANALYTICS_RATE_LIMIT_MAX_REQUESTS: ${ANALYTICS_RATE_LIMIT_MAX_REQUESTS:-5000}
      CONTACT_RATE_LIMIT_MAX_REQUESTS: ${CONTACT_RATE_LIMIT_MAX_REQUESTS:-1000}
    depends_on:
      mailpit:
        condition: service_healthy
