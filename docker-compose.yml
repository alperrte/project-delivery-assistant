services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command: ["postgres", "-p", "${DB_PORT:-5436}"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Local development only: reachable from this machine, never published on every network interface.
      - "127.0.0.1:${DB_PORT:-5436}:${DB_PORT:-5436}"
    volumes:
      - pda_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME} -p ${DB_PORT:-5436}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

# The frontend runs outside Docker: `cd frontend && npm run dev` (port 3000).

volumes:
  pda_postgres_data:
