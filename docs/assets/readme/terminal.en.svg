<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Set it up on your own server</title><desc id="d">Clone the repo, prepare .env, start the backend and database with Docker and the frontend with npm.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1730"/><stop offset="1" stop-color="#060a14"/></linearGradient><radialGradient id="gl" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#4c8dff" stop-opacity=".34"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></radialGradient><linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8bb8ff"/><stop offset="1" stop-color="#35d39b"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="cl"><rect width="900" height="460" rx="20"/></clipPath></defs><style>
.fl{animation:fl 5s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.bn{animation:bn 1.1s ease-in-out infinite}
@keyframes bn{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.pl{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.ring{animation:ring 1.7s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.92);opacity:.85}100%{transform:scale(1.4);opacity:0}}
.br{animation:br 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes br{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
@keyframes s1{0%,3.53%{transform:scaleX(1);animation-timing-function:steps(68,end)}16.47%,92.94%{transform:scaleX(0)}96.47%,100%{transform:scaleX(1)}}
.s1{animation:s1 17s infinite both linear;transform-box:fill-box;transform-origin:center}
@keyframes s2{0%,20%{transform:scaleX(1);animation-timing-function:steps(20,end)}25.88%,92.94%{transform:scaleX(0)}96.47%,100%{transform:scaleX(1)}}
.s2{animation:s2 17s infinite both linear;transform-box:fill-box;transform-origin:center}
@keyframes s3{0%,28.82%{transform:scaleX(1);animation-timing-function:steps(28,end)}37.06%,92.94%{transform:scaleX(0)}96.47%,100%{transform:scaleX(1)}}
.s3{animation:s3 17s infinite both linear;transform-box:fill-box;transform-origin:center}
@keyframes s4{0%,38.82%{opacity:0;transform:translateY(6px)}40.59%,92.94%{opacity:1;transform:none}94.71%,100%{opacity:0;transform:translateY(6px)}}
.s4{animation:s4 17s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s5{0%,42.94%{opacity:0;transform:translateY(6px)}44.71%,92.94%{opacity:1;transform:none}94.71%,100%{opacity:0;transform:translateY(6px)}}
.s5{animation:s5 17s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s6{0%,49.41%{transform:scaleX(1);animation-timing-function:steps(41,end)}60%,92.94%{transform:scaleX(0)}96.47%,100%{transform:scaleX(1)}}
.s6{animation:s6 17s infinite both linear;transform-box:fill-box;transform-origin:center}
@keyframes s7{0%,62.35%{opacity:0;transform:translateY(6px)}64.12%,92.94%{opacity:1;transform:none}94.71%,100%{opacity:0;transform:translateY(6px)}}
.s7{animation:s7 17s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}.cov{transform-box:fill-box}@media (prefers-reduced-motion:reduce){.cov{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g clip-path="url(#cl)"><rect x="0" y="0" width="900" height="460" rx="0" fill="url(#bg)"/><rect x="0" y="0" width="900" height="460" rx="0" fill="url(#dots)"/></g><rect x="0.5" y="0.5" width="899" height="459" rx="20" fill="none" stroke="#25325a" stroke-width="1"/><rect x="24" y="24" width="852" height="372" rx="14" fill="#0a1020" stroke="#25325a" stroke-width="1"/><rect x="24" y="24" width="852" height="40" rx="14" fill="#111b33"/><rect x="24" y="50" width="852" height="14" rx="0" fill="#111b33"/><circle cx="48" cy="44" r="6" fill="#ff6b81"/><circle cx="68" cy="44" r="6" fill="#f5b94a"/><circle cx="88" cy="44" r="6" fill="#35d39b"/><text x="450" y="49" font-size="13" fill="#8a98b8" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Terminal</text><text x="48" y="100" font-size="15" fill="#e9eefb" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"><tspan fill="#35d39b">$</tspan><tspan fill="#e9eefb"> git clone https://github.com/alperrte/project-delivery-assistant.git</tspan></text><g class="s1 cov" style="transform-origin:right center"><rect x="48" y="82" width="686" height="26" rx="0" fill="#0a1020"/></g><text x="48" y="130" font-size="15" fill="#e9eefb" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"><tspan fill="#35d39b">$</tspan><tspan fill="#e9eefb"> cp .env.example .env</tspan></text><g class="s2 cov" style="transform-origin:right center"><rect x="48" y="112" width="249" height="26" rx="0" fill="#0a1020"/></g><text x="48" y="160" font-size="15" fill="#e9eefb" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"><tspan fill="#35d39b">$</tspan><tspan fill="#e9eefb"> docker compose up --build -d</tspan></text><g class="s3 cov" style="transform-origin:right center"><rect x="48" y="142" width="322" height="26" rx="0" fill="#0a1020"/></g><g class="s4"><text x="48" y="190" font-size="15" fill="#35d39b" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> ✔ postgres  Healthy</text></g><g class="s5"><text x="48" y="218" font-size="15" fill="#35d39b" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> ✔ backend   Started</text></g><text x="48" y="258" font-size="15" fill="#e9eefb" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"><tspan fill="#35d39b">$</tspan><tspan fill="#e9eefb"> cd frontend &amp;&amp; npm install &amp;&amp; npm run dev</tspan></text><g class="s6 cov" style="transform-origin:right center"><rect x="48" y="240" width="440" height="26" rx="0" fill="#0a1020"/></g><g class="s7"><text x="48" y="288" font-size="15" fill="#8bb8ff" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> ▲ http://localhost:3000  · Ready</text></g><g class="cur"><rect x="52" y="304" width="9" height="18" rx="1" fill="#e9eefb"/></g><text x="450" y="430" font-size="14" fill="#8a98b8" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Apache 2.0 · Your server, your data.</text></svg>