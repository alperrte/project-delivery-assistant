206" height="28" rx="0" fill="none"/><rect x="284" y="322" width="59.36" height="28" rx="14" fill="#f5b94a26" stroke="#f5b94a" stroke-width="1"/><text x="298" y="341" font-size="14" fill="#f5b94a" font-weight="600" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">High</text><text x="504" y="312" font-size="12" fill="#8a98b8" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="1">Due</text><rect x="504" y="322" width="206" height="28" rx="0" fill="none"/><text x="504" y="342" font-size="15" fill="#e9eefb" font-weight="500" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Oct 30</text><text x="724" y="312" font-size="12" fill="#8a98b8" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="1">Estimate</text><rect x="724" y="322" width="206" height="28" rx="0" fill="none"/><text x="724" y="342" font-size="15" fill="#e9eefb" font-weight="500" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8 h · 5 pts</text></g><g class="s5"><text x="64" y="380" font-size="12" fill="#8a98b8" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="1">Subtasks</text><rect x="64" y="392" width="20" height="20" rx="6" fill="#35d39b"/><path d="M69 402 l4 4 l7 -8" stroke="#06101f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="407" font-size="15" fill="#e9eefb" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Design</text><rect x="190" y="392" width="20" height="20" rx="6" fill="#35d39b"/><path d="M195 402 l4 4 l7 -8" stroke="#06101f" s