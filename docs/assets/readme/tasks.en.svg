<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Simple and advanced tasks</title><desc id="d">The task form opens with a title and description in simple mode, and adds assignees, priority, due date, estimate and subtasks in advanced mode.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1730"/><stop offset="1" stop-color="#060a14"/></linearGradient><radialGradient id="gl" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#4c8dff" stop-opacity=".34"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></radialGradient><linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8bb8ff"/><stop offset="1" stop-color="#35d39b"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="cl"><rect width="1000" height="500" rx="20"/></clipPath></defs><style>
.fl{animation:fl 5s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.bn{animation:bn 1.1s ease-in-out infinite}
@keyframes bn{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.pl{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.ring{animation:ring 1.7s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.92);opacity:.85}100%{transform:scale(1.4);opacity:0}}
.br{animation:br 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes br{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
@keyframes s1{0%,44%{transform:translateX(-150px)}50%,92%{transform:none}98%,100%{transform:translateX(-150px)}}
.s1{animation:s1 10s infinite both cubic-bezier(.65,0,.35,1);transform-box:fill-box;transform-origin:center}
@keyframes s2{0%,0%{opacity:0;transform:none}2.5%,47%{opacity:1;transform:none}49.5%,100%{opacity:0;transform:none}}
.s2{animation:s2 10s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s3{0%,50%{opacity:0;transform:none}52.5%,94%{opacity:1;transform:none}96.5%,100%{opacity:0;transform:none}}
.s3{animation:s3 10s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s4{0%,53%{opacity:0;transform:translateY(10px)}57.5%,94%{opacity:1;transform:none}98.5%,100%{opacity:0;transform:translateY(10px)}}
.s4{animation:s4 10s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s5{0%,58%{opacity:0;transform:translateY(10px)}62.5%,94%{opacity:1;transform:none}98.5%,100%{opacity:0;transform:translateY(10px)}}
.s5{animation:s5 10s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){.alt{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
