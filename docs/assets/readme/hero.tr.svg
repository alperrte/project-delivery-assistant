<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">PDA: görev, sohbet, toplantı ve kod tek çalışma alanında</title><desc id="d">Animasyonlu başlık: PDA'da toplantı, sohbet, görev ve repo bir arada.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1730"/><stop offset="1" stop-color="#060a14"/></linearGradient><radialGradient id="gl" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#4c8dff" stop-opacity=".34"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></radialGradient><linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8bb8ff"/><stop offset="1" stop-color="#35d39b"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="cl"><rect width="1200" height="520" rx="20"/></clipPath></defs><style>
