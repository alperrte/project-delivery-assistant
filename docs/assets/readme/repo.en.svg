.ring{animation:ring 1.7s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.92);opacity:.85}100%{transform:scale(1.4);opacity:0}}
.br{animation:br 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes br{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
@keyframes s1{0%,44%{transform:translateX(-140px)}50%,92%{transform:none}98%,100%{transform:translateX(-140px)}}
.s1{animation:s1 11s infinite both cubic-bezier(.65,0,.35,1);transform-box:fill-box;transform-origin:center}
@keyframes s2{0%,0%{opacity:0;transform:none}2.27%,44.55%{opacity:1;transform:none}46.82%,100%{opacity:0;transform:none}}
.s2{animation:s2 11s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s3{0%,47.27%{opacity:0;transform:none}49.55%,92.73%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
.s3{animation:s3 11s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s4{0%,0%{opacity:0;transform:none}2.73%,44.55%{opacity:1;transform:none}47.27%,100%{opacity:0;transform:none}}
.s4{animation:s4 11s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s5{0%,47.27%{opacity:0;transform:none}50%,92.73%{opacity:1;transform:none}95.45%,100%{opacity:0;transform:none}}
.s5{animation:s5 11s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
@keyframes s6{0%,23.64%{opacity:0;transform:translateX(40px)}28.18%,42.73%{opacity:1;transform:none}47.27%,100%{opacity:0;transform:translateX(40px)}}
.s6{animation:s6 11s infinite both cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){.alt{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
